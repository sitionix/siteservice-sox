environment: localhost
server:
  port: 9080
  servlet:
    context-path: /stsssox
spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/SITES_SOX}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres-pwd}
  flyway:
    locations: classpath:stsssox/db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
forge:
  outbox:
    domain-store: POSTGRES
  security:
    service-id: sitionixSite
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET:dev-internal-auth-secret}
      issuer: ${FORGE_SECURITY_DEV_ISSUER:sitionix-internal}
      ttl-seconds: ${FORGE_SECURITY_DEV_TTL_SECONDS:300}
    policies:
      sitionixBff:
        allow:
          - "*"

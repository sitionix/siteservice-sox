environment: localhost
server:
  port: 9080
  servlet:
    context-path: /stsssox
spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:SITES_SOX}
      uuid-representation: standard
      auto-index-creation: true
forge:
  security:
    service-id: sitionixSite
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET}
      issuer: sitionix-internal
      ttl-seconds: 300
    policies:
      sitionixBff:
        allow:
          - "*"

environment: localhost
server:
  port: 9080
  servlet:
    context-path: /stsssox
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:SITES_SOX}
      uuid-representation: standard
      auto-index-creation: true
forge:
  security:
    service-id: sitionixSite
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET:dev-internal-auth-secret}
      issuer: ${FORGE_SECURITY_DEV_ISSUER:sitionix-internal}
      ttl-seconds: ${FORGE_SECURITY_DEV_TTL_SECONDS:300}
    policies:
      sitionixBff:
        allow:
          - "*"
